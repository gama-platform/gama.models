# Publishes GitHub Pages: the legacy p2 update site (branch p2-deploy) + the model registry under /registry/.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy model registry

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "tools/registry/**"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1" # weekly, also picks up changes pushed to p2-deploy

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Check out the p2 update site
        uses: actions/checkout@v5
        with:
          ref: p2-deploy
          path: _site
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/registry/requirements.txt

      - run: pip install -r tools/registry/requirements.txt

      - name: Build the registry
        run: |
          rm -rf _site/.git _site/registry
          python -m tools.registry build-index --out _site/registry

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}registry/index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
