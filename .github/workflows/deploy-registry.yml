# Publishes the model registry on GitHub Pages under /registry/ (index.json, models/*.json, schema/).
# Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy model registry

on:
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "tools/registry/**"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/registry/requirements.txt

      - run: pip install -r tools/registry/requirements.txt

      - name: Build the registry
        run: python -m tools.registry build-index --out _site/registry

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}registry/index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
