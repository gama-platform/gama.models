name: Model registry checks

on:
  pull_request:
    paths:
      - "registry/**"
      - "tools/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/registry-ci.yml"
  push:
    branches: [main]
    paths:
      - "registry/**"
      - "tools/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/registry/requirements.txt

      - run: pip install -r tools/registry/requirements.txt

      - name: Unit tests
        run: python -m pytest -q tools/registry/tests

      - name: Validate every registry entry and the generated index
        run: python -m tools.registry build-index --check
